<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>TryClothes</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/favicon-48x48.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico?v=20260527">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=20260527">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260527">
    <script>
        (function () {
            var apiHost = "https://api.try-clothes.com";
            if (window.location.pathname.indexOf("/api/") === 0) {
                window.location.replace(apiHost + window.location.pathname + window.location.search + window.location.hash);
            } else {
                window.location.replace("/");
            }
        })();
    </script>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #030303;
            color: #f7f1e5;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        a {
            color: #e8c982;
        }
    </style>
</head>
<body>
    <main>
        <p>Te redirecționăm către TryClothes...</p>
        <p><a id="fallback-link" href="/">Continuă manual</a></p>
    </main>
    <script>
        var fallback = document.getElementById("fallback-link");
        if (window.location.pathname.indexOf("/api/") === 0) {
            fallback.href = "https://api.try-clothes.com" + window.location.pathname + window.location.search + window.location.hash;
        }
    </script>
</body>
</html>
